name: tests

on:
  workflow_call:

env:
  SOLUTION: LupiraAssistantBff.slnx
  PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ${{ env.SOLUTION }} -c Release
      # Hermetic (in-process stub upstream, no Docker) — cheap enough to run always.
      - run: dotnet test tests/LupiraAssistantBff.IntegrationTests -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm i -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
